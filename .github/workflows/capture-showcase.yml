name: Capture dashboard showcase

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed demo application's base URL
        required: true
        type: string
      tenant:
        description: Synthetic demo workspace slug
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: showcase-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate showcase secrets
        env:
          SHOWCASE_EMAIL: ${{ secrets.DEMO_EMAIL }}
          SHOWCASE_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          test -n "$SHOWCASE_EMAIL" || (echo "::error::Add DEMO_EMAIL in repository Actions secrets." && exit 1)
          test -n "$SHOWCASE_PASSWORD" || (echo "::error::Add DEMO_PASSWORD in repository Actions secrets." && exit 1)
      - name: Capture real dashboard screenshots
        env:
          SHOWCASE_BASE_URL: ${{ inputs.base_url }}
          SHOWCASE_TENANT: ${{ inputs.tenant }}
          SHOWCASE_EMAIL: ${{ secrets.DEMO_EMAIL }}
          SHOWCASE_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: npm run capture:showcase
      - name: Verify all 12 screenshots
        shell: bash
        run: |
          set -euo pipefail
          test -s "docs/screenshots/01-command-center.png"
          test -s "docs/screenshots/02-service-portfolio.png"
          test -s "docs/screenshots/03-business-impact-analysis.png"
          test -s "docs/screenshots/04-dependency-intelligence.png"
          test -s "docs/screenshots/05-dependency-workflow.png"
          test -s "docs/screenshots/06-risk-register.png"
          test -s "docs/screenshots/07-incident-response.png"
          test -s "docs/screenshots/08-control-assurance.png"
          test -s "docs/screenshots/09-continuity-workspace.png"
          test -s "docs/screenshots/10-continuity-plan-builder.png"
          test -s "docs/screenshots/11-exercise-management.png"
          test -s "docs/screenshots/12-remediation-tracker.png"
          test "$(find docs/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 12
      - name: Commit verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged; no commit required."
          else
            git commit -m "docs: publish verified dashboard showcase screenshots"
            git push
          fi
