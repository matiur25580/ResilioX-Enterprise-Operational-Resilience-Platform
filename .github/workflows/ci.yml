name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API quality gates
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AUTH_TOKEN_SECRET: ci-only-test-secret-do-not-use-in-production-32chars
      DATABASE_URL: postgresql://continuitygrid:continuitygrid_dev@localhost:5432/continuitygrid?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: continuitygrid
          POSTGRES_PASSWORD: continuitygrid_dev
          POSTGRES_DB: continuitygrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuitygrid -d continuitygrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency advisories (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --workspace=@continuitygrid/api --audit-level=high
      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
