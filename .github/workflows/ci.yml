name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, milestone-03-identity, milestone-04-command-center, milestone-05-business-impact-analysis, milestone-06-dependency-intelligence, feat/milestone-11-third-party-resilience]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      AUTH_TOKEN_SECRET: ci-only-test-secret-do-not-use-in-production-32chars
      DATABASE_URL: postgresql://continuitygrid:continuitygrid_dev@localhost:5432/continuitygrid?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: continuitygrid
          POSTGRES_PASSWORD: continuitygrid_dev
          POSTGRES_DB: continuitygrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuitygrid -d continuitygrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run authenticated supplier browser workflow
        env:
          NODE_ENV: test
          AUTH_TOKEN_SECRET: ci-only-test-secret-do-not-use-in-production-32chars
          DATABASE_URL: postgresql://continuitygrid:continuitygrid_dev@localhost:5432/continuitygrid?schema=public
          CORS_ORIGIN: http://127.0.0.1:4173
        run: |
          nohup npm run dev:api > /tmp/resiliox-api.log 2>&1 &
          nohup npm run preview --workspace @continuitygrid/web -- --host 127.0.0.1 > /tmp/resiliox-web.log 2>&1 &
          node scripts/e2e-supplier-workflow.mjs
