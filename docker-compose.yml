services:
  postgres:
    image: postgres:17-alpine
    container_name: continuitygrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: continuitygrid
      POSTGRES_PASSWORD: continuitygrid_dev
      POSTGRES_DB: continuitygrid
    ports:
      - "5432:5432"
    volumes:
      - continuitygrid-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuitygrid -d continuitygrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: continuitygrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - continuitygrid-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  continuitygrid-postgres-data:
  continuitygrid-redis-data:
